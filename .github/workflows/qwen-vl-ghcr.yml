name: qwen-vl-ghcr

on:
  push:
    branches: [do-search-runpod]
    paths:
      - runpod/qwen-vl/**
      - .github/workflows/qwen-vl-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runpod/qwen-vl
          push: true
          tags: |
            ghcr.io/codenuclei/video-image-search-indexer-quality/dfi-qwen3-vl-sglang:gpu
            ghcr.io/codenuclei/video-image-search-indexer-quality/dfi-qwen3-vl-sglang:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
