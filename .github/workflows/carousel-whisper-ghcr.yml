# Build the Carousel Studio faster-whisper image on GitHub.
name: carousel-whisper-ghcr

on:
  push:
    branches: [pruned-craousel]
    paths:
      - deploy/runpod-whisper/**
      - .github/workflows/carousel-whisper-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/runpod-whisper
          push: true
          tags: |
            ghcr.io/codenuclei/video-image-search-indexer-quality/dfi-carousel-whisper:latest
            ghcr.io/codenuclei/video-image-search-indexer-quality/dfi-carousel-whisper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
