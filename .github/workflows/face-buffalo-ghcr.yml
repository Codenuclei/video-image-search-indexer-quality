# Build the RunPod buffalo_l image on GitHub (this Mac has no Docker.app).
# Push only from do-search-runpod so main/Railway stay untouched.
name: face-buffalo-ghcr

on:
  push:
    branches: [do-search-runpod]
    paths:
      - runpod/face-buffalo/**
      - .github/workflows/face-buffalo-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runpod/face-buffalo
          push: true
          tags: |
            ghcr.io/codenuclei/video-image-search-indexer-quality/dfi-face-buffalo:gpu
            ghcr.io/codenuclei/video-image-search-indexer-quality/dfi-face-buffalo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
