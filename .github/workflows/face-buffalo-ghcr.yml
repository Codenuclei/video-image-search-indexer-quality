# Build the RunPod buffalo_l image on GitHub (this Mac has no Docker.app).
# Push only from do-search-runpod so main/Railway stay untouched.
name: face-buffalo-ghcr

on:
  push:
    branches: [do-search-runpod]
    paths:
      - runpod/face-buffalo/**
      - .github/workflows/face-buffalo-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve release image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dfi-face-buffalo" >> "$GITHUB_OUTPUT"
      - id: build
        name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: runpod/face-buffalo
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:gpu
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable release
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo "## Face worker release"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Source commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
