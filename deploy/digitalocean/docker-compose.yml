# Carousel Studio stack for the DigitalOcean Droplet.
# Public traffic terminates at Caddy; backend, Postgres, and Qdrant stay private.
#
# Usage (on the Droplet):
#   cp .env.example .env   # generate POSTGRES_PASSWORD
#   docker compose --env-file .env up -d
#
# Security:
# - Ports bind to DROPLET_BIND_ADDR (default 127.0.0.1). For VPC access set
#   DROPLET_BIND_ADDR to the Droplet private IP (10.x / 192.168.x).
# - Do NOT publish 5432/6333 on the public interface. Use a DigitalOcean Cloud
#   Firewall allowing those ports only from the VPC CIDR (or App Platform VPC).
# - Restart unless-stopped; named volumes for durability.

name: dfi-carousel-data

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      carousel-backend:
        condition: service_healthy
    environment:
      CAROUSEL_BACKEND_DOMAIN: ${CAROUSEL_BACKEND_DOMAIN:-api-carousel.139-59-35-242.sslip.io}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - carousel_caddy_data:/data
      - carousel_caddy_config:/config
    networks:
      - carousel_data

  carousel-backend:
    image: ${CAROUSEL_BACKEND_IMAGE:?set CAROUSEL_BACKEND_IMAGE to an immutable DOCR tag}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "1"
      GUNICORN_WORKERS: "1"
      GUNICORN_TIMEOUT: "3600"
      GUNICORN_GRACEFUL_TIMEOUT: "120"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      VIDEO_INDEX_MAX_PARALLEL: "1"
      VIDEO_TRANSCRIPT_FIRST_ENABLED: "true"
      RUN_INDEXER: "true"
      FACE_JOBS_ENABLED: "false"
      RUN_FACE_WORKER: "false"
      AUTO_INDEX_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-carousel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carousel}
      QDRANT_URL: http://qdrant:6333
      VIDEO_CACHE_DIR: /app/data/videos
      MEDIA_CACHE_DIR: /app/data/media_cache
      TEMP_DIR: /app/data/tmp
      THUMBNAIL_DIR: /app/data/thumbnails
      FENNEC_VIDEO_CACHE_DIR: /app/data/fennec-media
      BACKUP_DIR: /app/data/backups
    volumes:
      - ${BACKEND_DATA_DIR:-/opt/dfi-carousel/backend-data}:/app/data
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - carousel_data

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carousel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-carousel}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - carousel_pg_data:/var/lib/postgresql/data
    ports:
      - "${DROPLET_BIND_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - carousel_data
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB

  qdrant:
    # Pin for reproducible restores; bump intentionally after testing.
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    volumes:
      - carousel_qdrant_storage:/qdrant/storage
      - carousel_qdrant_snapshots:/qdrant/snapshots
    ports:
      # REST only for App Platform clients; keep gRPC private/unexposed.
      - "${DROPLET_BIND_ADDR:-127.0.0.1}:6333:6333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | grep -qiE \"ok|ready\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - carousel_data

volumes:
  carousel_pg_data:
  carousel_qdrant_storage:
  carousel_qdrant_snapshots:
  carousel_caddy_data:
  carousel_caddy_config:

networks:
  carousel_data:
    driver: bridge
