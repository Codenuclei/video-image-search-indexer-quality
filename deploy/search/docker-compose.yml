# Search stack for the DigitalOcean search-api droplet.
# Indexer stays off. Face extraction (if unpaused) calls RunPod serverless
# buffalo_l — no InsightFace on this box. Does not replace Railway.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      APP_SESSION_SECRET: ${APP_SESSION_SECRET}
    expose:
      - "3001"
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend.env
    environment:
      RUN_INDEXER: "false"
      RUN_FACE_WORKER: "false"
      FACE_JOBS_ENABLED: "true"
      AUTO_INDEX_ENABLED: "false"
      RUNPOD_FACE_ENDPOINT_ID: ${RUNPOD_FACE_ENDPOINT_ID:-0zub88paibpsf3}
      RUNPOD_FACE_GPU_ENABLED: "true"
      RUNPOD_FACE_MAX_EDGE: "0"
      RUNPOD_FACE_JPEG_QUALITY: "95"
      RUNPOD_FACE_VIDEO_MAX_BYTES: "10737418240"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.165.245.170.117.sslip.io}
      FACE_JOB_LEASE_SECONDS: "3600"
      GUNICORN_TIMEOUT: "3600"
      WEB_CONCURRENCY: "2"
      GUNICORN_WORKERS: "2"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - backend_data:/app/data
      - ../../backend/app/db/session.py:/app/app/db/session.py:ro
      - ../../backend/app/reid/face_thumbs.py:/app/app/reid/face_thumbs.py:ro
      - ../../backend/app/routers/persons.py:/app/app/routers/persons.py:ro
    expose:
      - "8000"
    depends_on:
      - connector

  connector:
    build:
      context: ../../../google-drive-connector
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - connector.env
    volumes:
      - connector_data:/app/data
    expose:
      - "3000"

volumes:
  caddy_data:
  caddy_config:
  backend_data:
  connector_data:
