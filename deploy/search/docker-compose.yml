# Search stack for the DigitalOcean search-api droplet.
# Build an immutable backend image from do-search-runpod — no host bind mounts.
# Indexer coordinator is a compose profile (`indexing`) and stays off until
# cutover approval. RunPod serverless does buffalo_l + Qwen. Does not replace Railway.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      APP_SESSION_SECRET: ${APP_SESSION_SECRET}
    expose:
      - "3001"
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        IMAGE_DIGEST: ${IMAGE_DIGEST:-unknown}
    restart: unless-stopped
    env_file:
      - backend.env
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      IMAGE_DIGEST: ${IMAGE_DIGEST:-unknown}
      RUN_INDEXER: "false"
      # Dedicated indexer owns the shared background-leader lock. The API keeps
      # the RunPod face queue without competing for indexer leadership.
      RUN_FACE_WORKER: "true"
      FACE_JOBS_ENABLED: "true"
      AUTO_INDEX_ENABLED: "false"
      RUNPOD_FACE_ENDPOINT_ID: ${RUNPOD_FACE_ENDPOINT_ID:-0zub88paibpsf3}
      RUNPOD_FACE_GPU_ENABLED: "true"
      RUNPOD_FACE_WORKERS_MAX: "4"
      RUNPOD_FACE_MAX_EDGE: "0"
      RUNPOD_FACE_JPEG_QUALITY: "95"
      RUNPOD_FACE_VIDEO_MAX_BYTES: "10737418240"
      RUNPOD_FACE_VIDEO_MAX_FRAMES: "80"
      RUNPOD_FACE_VIDEO_MAX_RESPONSE_BYTES: "50331648"
      RUNPOD_QWEN_ENDPOINT_ID: "ya97mr5kgtwdi1"
      RUNPOD_QWEN_WORKERS_MAX: "2"
      QWEN_IDENTIFY_CONCURRENCY: "2"
      FACE_WORKER_CONCURRENCY: "4"
      WHISPER_FALLBACK_ENABLED: "false"
      GEMINI_GENERATION_DISABLED: "true"
      IMAGE_CAPTION_ENABLED: "false"
      SEARCH_CAPTION_FILTER_ENABLED: "false"
      SEARCH_QUERY_EXPANSION: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.165.245.170.117.sslip.io}
      FACE_JOB_LEASE_SECONDS: "3600"
      GUNICORN_TIMEOUT: "3600"
      WEB_CONCURRENCY: "2"
      GUNICORN_WORKERS: "2"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"
    depends_on:
      - connector

  # Same image as backend. Starts only with the explicit `indexing` profile:
  #   GIT_SHA=<sha> docker compose --profile indexing up -d indexer
  # Auto-index admission remains controlled by app_settings/global pause.
  indexer:
    profiles: ["indexing"]
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        IMAGE_DIGEST: ${IMAGE_DIGEST:-unknown}
    restart: unless-stopped
    env_file:
      - backend.env
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      IMAGE_DIGEST: ${IMAGE_DIGEST:-unknown}
      RUN_INDEXER: "true"
      AUTO_INDEX_ENABLED: "false"
      RUN_FACE_WORKER: "false"
      FACE_JOBS_ENABLED: "true"
      RUNPOD_FACE_ENDPOINT_ID: ${RUNPOD_FACE_ENDPOINT_ID:-0zub88paibpsf3}
      RUNPOD_FACE_GPU_ENABLED: "true"
      RUNPOD_FACE_WORKERS_MAX: "4"
      RUNPOD_FACE_VIDEO_MAX_FRAMES: "80"
      RUNPOD_FACE_VIDEO_MAX_RESPONSE_BYTES: "50331648"
      RUNPOD_QWEN_ENDPOINT_ID: "ya97mr5kgtwdi1"
      RUNPOD_QWEN_WORKERS_MAX: "2"
      QWEN_IDENTIFY_CONCURRENCY: "2"
      FACE_WORKER_CONCURRENCY: "4"
      WHISPER_FALLBACK_ENABLED: "false"
      GEMINI_GENERATION_DISABLED: "true"
      IMAGE_CAPTION_ENABLED: "false"
      SEARCH_CAPTION_FILTER_ENABLED: "false"
      SEARCH_QUERY_EXPANSION: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.165.245.170.117.sslip.io}
      WEB_CONCURRENCY: "1"
      GUNICORN_WORKERS: "1"
      GUNICORN_TIMEOUT: "3600"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"
    depends_on:
      - connector

  connector:
    build:
      context: ../../../google-drive-connector
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - connector.env
    volumes:
      - connector_data:/app/data
    expose:
      - "3000"

volumes:
  caddy_data:
  caddy_config:
  backend_data:
  connector_data:
