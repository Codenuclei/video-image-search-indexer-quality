<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Voxel Arena</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05010d; font-family: "Trebuchet MS", sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 18px; top: 16px; color: #7ffcff;
      text-shadow: 0 0 12px #00fff2; z-index: 5; pointer-events: none; font-size: 18px;
    }
    #hint { opacity: 0.8; font-size: 13px; color: #ff7bff; }
    #victory {
      position: fixed; inset: 0; display: none; place-items: center;
      font-size: clamp(64px, 12vw, 160px); color: #7ffcff; letter-spacing: 0.12em;
      text-shadow: 0 0 24px #00fff2, 0 0 48px #ff00ea; z-index: 6; pointer-events: none;
    }
    #confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 7; }
    .bit {
      position: absolute; width: 8px; height: 8px; opacity: 0.95;
    }
  </style>
</head>
<body>
  <div id="hud">CUBES <span id="count">0</span> / 10<br><span id="hint">WASD move · mouse look · Space jump · click to capture pointer</span></div>
  <div id="victory">VICTORY</div>
  <div id="confetti"></div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x12061f);
    scene.fog = new THREE.FogExp2(0x1a0830, 0.018);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const sun = new THREE.DirectionalLight(0xfff0c8, 1.35);
    sun.position.set(18, 28, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x6644aa, 0.55));
    scene.add(new THREE.HemisphereLight(0x66ffff, 0xff44cc, 0.35));
    const magenta = new THREE.PointLight(0xff00ea, 2.2, 40);
    magenta.position.set(8, 6, 4);
    scene.add(magenta);
    const cyan = new THREE.PointLight(0x00fff2, 2.2, 40);
    cyan.position.set(-8, 6, -2);
    scene.add(cyan);

    const solids = [];
    function box(w, h, d, x, y, z, color, emissive = 0x000000) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({
          color, emissive, emissiveIntensity: emissive ? 1.4 : 0,
          roughness: 0.45, metalness: 0.25,
        })
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      solids.push({ mesh, w, h, d });
      return mesh;
    }

    // Three connected floating platforms
    box(16, 1.2, 16, -12, 0, 0, 0x1b2a44);
    box(14, 1.2, 14, 8, 2.2, 6, 0x2a1540);
    box(12, 1.2, 12, 2, 4.6, -12, 0x15263a);
    box(8, 0.8, 3, -2, 1.1, 3, 0xff00ea, 0x550044);
    box(3, 0.8, 10, 8, 3.4, -4, 0x00fff2, 0x004444);
    // island rim voxels
    for (const [x, z, c] of [[-18, -6, 0x00fff2], [16, 12, 0xff00ea], [10, -18, 0x00fff2], [-16, 10, 0xff00ea]]) {
      box(2, 2, 2, x, 3, z, c, c);
    }

    const cubeGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
    const cubeMat = new THREE.MeshStandardMaterial({
      color: 0x7ffcff, emissive: 0x00fff2, emissiveIntensity: 2, roughness: 0.15, metalness: 0.6,
    });
    const cubeSpots = [
      [-12, 1.5, 0], [-16, 1.5, 4], [-8, 1.5, -5], [-14, 1.5, -4],
      [8, 3.7, 6], [12, 3.7, 10], [4, 3.7, 8],
      [2, 6.1, -12], [5, 6.1, -15], [-1, 6.1, -9],
    ];
    const cubes = cubeSpots.map(([x, y, z]) => {
      const m = new THREE.Mesh(cubeGeo, cubeMat.clone());
      m.position.set(x, y, z);
      m.castShadow = true;
      scene.add(m);
      return m;
    });

    const player = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 1.1, 0.7),
      new THREE.MeshStandardMaterial({ color: 0xff4cf0, emissive: 0x4a0038, roughness: 0.35, metalness: 0.4 })
    );
    body.position.y = 0.85;
    const head = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 0.55, 0.7),
      new THREE.MeshStandardMaterial({ color: 0x7ffcff, emissive: 0x005555, roughness: 0.3 })
    );
    head.position.y = 1.65;
    player.add(body, head);
    player.position.set(-12, 1.2, 2);
    scene.add(player);

    const keys = Object.create(null);
    addEventListener("keydown", (e) => { keys[e.code] = true; if (e.code === "Space") e.preventDefault(); });
    addEventListener("keyup", (e) => { keys[e.code] = false; });

    let yaw = 0.4, pitch = 0.35;
    renderer.domElement.addEventListener("click", () => renderer.domElement.requestPointerLock());
    addEventListener("mousemove", (e) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      yaw -= e.movementX * 0.0025;
      pitch = Math.max(0.12, Math.min(1.15, pitch + e.movementY * 0.002));
    });

    const vel = new THREE.Vector3();
    let grounded = false;
    let collected = 0;
    let won = false;
    const countEl = document.getElementById("count");
    const victoryEl = document.getElementById("victory");
    const confettiEl = document.getElementById("confetti");

    function collide(next) {
      const hw = 0.4, hh = 0.95, hd = 0.35;
      for (const s of solids) {
        const dx = Math.abs(next.x - s.mesh.position.x);
        const dy = Math.abs(next.y + hh - s.mesh.position.y);
        const dz = Math.abs(next.z - s.mesh.position.z);
        if (dx < hw + s.w / 2 && dy < hh + s.h / 2 && dz < hd + s.d / 2) {
          const ox = hw + s.w / 2 - dx;
          const oy = hh + s.h / 2 - dy;
          const oz = hd + s.d / 2 - dz;
          if (oy <= ox && oy <= oz) {
            if (next.y + hh > s.mesh.position.y) {
              next.y = s.mesh.position.y + s.h / 2;
              if (vel.y <= 0) { vel.y = 0; grounded = true; }
            } else {
              next.y = s.mesh.position.y - s.h / 2 - hh * 2;
              vel.y = Math.min(0, vel.y);
            }
          } else if (ox <= oz) {
            next.x += Math.sign(next.x - s.mesh.position.x) * ox;
          } else {
            next.z += Math.sign(next.z - s.mesh.position.z) * oz;
          }
        }
      }
      return next;
    }

    function burstConfetti() {
      confettiEl.innerHTML = "";
      for (let i = 0; i < 140; i++) {
        const bit = document.createElement("div");
        bit.className = "bit";
        const cyan = Math.random() > 0.5;
        bit.style.background = cyan ? "#00fff2" : "#ff00ea";
        bit.style.left = innerWidth / 2 + "px";
        bit.style.top = innerHeight / 3 + "px";
        confettiEl.appendChild(bit);
        const vx = (Math.random() - 0.5) * 18;
        const vy = -Math.random() * 16 - 4;
        const x0 = innerWidth / 2, y0 = innerHeight / 3;
        const t0 = performance.now();
        (function step() {
          const t = (performance.now() - t0) / 16.6;
          const x = x0 + vx * t;
          const y = y0 + vy * t + 0.18 * t * t;
          bit.style.left = x + "px";
          bit.style.top = y + "px";
          if (y < innerHeight + 40) requestAnimationFrame(step);
          else bit.remove();
        })();
      }
    }

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const wish = new THREE.Vector3();
      if (keys.KeyW) wish.add(forward);
      if (keys.KeyS) wish.sub(forward);
      if (keys.KeyA) wish.sub(right);
      if (keys.KeyD) wish.add(right);
      if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(9);
      vel.x = THREE.MathUtils.damp(vel.x, wish.x, 8, dt);
      vel.z = THREE.MathUtils.damp(vel.z, wish.z, 8, dt);
      vel.y -= 28 * dt;
      if (keys.Space && grounded) {
        vel.y = 11;
        grounded = false;
      }

      grounded = false;
      const next = player.position.clone().addScaledVector(vel, dt);
      if (next.y < -20) {
        next.set(-12, 4, 2);
        vel.set(0, 0, 0);
      }
      collide(next);
      player.position.copy(next);
      player.rotation.y = yaw;

      for (const cube of cubes) {
        if (cube.userData.gone) continue;
        cube.rotation.y += dt * 1.6;
        cube.position.y += Math.sin(now / 250 + cube.position.x) * 0.01;
        if (cube.position.distanceTo(player.position.clone().setY(player.position.y + 1)) < 1.2) {
          cube.userData.gone = true;
          scene.remove(cube);
          collected += 1;
          countEl.textContent = String(collected);
          if (collected >= 10 && !won) {
            won = true;
            victoryEl.style.display = "grid";
            burstConfetti();
          }
        }
      }

      const camOff = new THREE.Vector3(
        Math.sin(yaw) * -7 * Math.cos(pitch - 0.2),
        2.4 + Math.sin(pitch) * 6,
        Math.cos(yaw) * -7 * Math.cos(pitch - 0.2)
      );
      camera.position.lerp(player.position.clone().add(camOff), 1 - Math.pow(0.001, dt));
      camera.lookAt(player.position.x, player.position.y + 1.3, player.position.z);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
